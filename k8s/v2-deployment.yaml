apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopping-app-v2
  labels:
    app: shopping-app
    version: v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shopping-app
      version: v2
  template:
    metadata:
      labels:
        app: shopping-app
        version: v2
    spec:
      containers:
      - name: app
        image: your-dockerhub-username/shopping-app:v2
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: shopping-service-v2
spec:
  type: NodePort
  selector:
    app: shopping-app
    version: v2
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30002  # Accessible via http://localhost:30002
