apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopping-app-v1
  labels:
    app: shopping-app
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shopping-app
      version: v1
  template:
    metadata:
      labels:
        app: shopping-app
        version: v1
    spec:
      containers:
      - name: app
        image: your-dockerhub-username/shopping-app:v1
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: shopping-service-v1
spec:
  type: NodePort
  selector:
    app: shopping-app
    version: v1
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30001  # Accessible via http://localhost:30001
